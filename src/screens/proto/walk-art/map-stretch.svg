<svg viewBox="0 0 360 452" role="img" aria-label="Map: Agra in Uttar Pradesh, Dholpur in Rajasthan, the Chambal river as the border, Morena and Gwalior in Madhya Pradesh">
            <defs>
              <radialGradient id="m2glow"><stop offset="0" stop-color="#f2c46d" stop-opacity=".85"/><stop offset=".4" stop-color="#f2c46d" stop-opacity=".25"/><stop offset="1" stop-color="#f2c46d" stop-opacity="0"/></radialGradient>
              <pattern id="m2hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><line x1="0" y1="0" x2="0" y2="5" stroke="#c9dcea" stroke-width=".7" opacity=".22"/></pattern>
              <pattern id="m2hill" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><line x1="0" y1="0" x2="0" y2="4" stroke="#c9dcea" stroke-width=".6" opacity=".25"/></pattern>
              <filter id="m2soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
            </defs>
            <rect width="360" height="452" fill="#05081f" opacity=".72"/>
            <!-- Rajasthan tinted lightly, between the border line and the Chambal -->
            <path d="M0 126 C80 134 150 120 230 136 S330 142 360 138 L360 244 C300 232 240 258 180 250 S60 236 0 246 Z" fill="#c9dcea" opacity=".035"/>
            <!-- graticule -->
            <g stroke="#2a2f55" stroke-width=".8"><line x1="0" y1="150" x2="360" y2="150"/><line x1="0" y1="330" x2="360" y2="330"/><line x1="118" y1="0" x2="118" y2="452"/><line x1="268" y1="0" x2="268" y2="452"/></g>
            <g font-family="DM Mono" font-size="13" fill="#8e8ba6"><text x="122" y="446">78° E</text><text x="272" y="446">78° 30′</text><text x="6" y="145">27° N</text><text x="6" y="325">26° 30′</text></g>
            <!-- ravine hatching either side of the Chambal -->
            <path d="M0 214 C60 202 120 226 180 216 S300 196 360 206 L360 270 C300 262 230 286 170 278 S60 258 0 268 Z" fill="url(#m2hatch)"/>
            <path d="M206 382 q12 -22 24 0 M228 388 q10 -18 20 0 M94 372 q12 -22 24 0" fill="url(#m2hill)" stroke="#c9dcea" stroke-opacity=".35" stroke-width=".9"/>
            <!-- triangulation -->
            <g stroke="#c9dcea" stroke-opacity=".28" stroke-width=".9" stroke-dasharray="3 4" fill="none"><path d="M176 62 L300 160 L172 244 L52 160 Z M172 244 L300 340 L168 412 L52 330 Z"/></g>
            <g fill="#c9dcea" opacity=".45"><path d="M300 154 l5 9 h-10 z"/><path d="M52 154 l5 9 h-10 z"/><path d="M300 334 l5 9 h-10 z"/><path d="M52 324 l5 9 h-10 z"/></g>
            <!-- the Yamuna, and the Chambal as the border -->
            <path d="M-10 46 C60 56 120 36 180 52 S300 68 370 60" fill="none" stroke="#2c4a78" stroke-width="5" stroke-linecap="round"/>
            <path d="M-10 46 C60 56 120 36 180 52 S300 68 370 60" fill="none" stroke="#7f9ce0" stroke-width="1.2" opacity=".7"/>
            <text x="16" y="38" font-family="Fraunces Variable, Georgia, serif" font-style="italic" font-size="15" fill="#7f9ce0">Yamuna</text>
            <path d="M-10 246 C60 236 120 260 180 250 S300 230 370 240" fill="none" stroke="#2c4a78" stroke-width="6" stroke-linecap="round"/>
            <path d="M-10 246 C60 236 120 260 180 250 S300 230 370 240" fill="none" stroke="#7f9ce0" stroke-width="1.2" opacity=".7"/>
            <text x="16" y="232" font-family="Fraunces Variable, Georgia, serif" font-style="italic" font-size="15" fill="#7f9ce0">Chambal · the border</text>
            <!-- the Uttar Pradesh–Rajasthan line -->
            <path d="M0 126 C80 134 150 120 230 136 S330 142 360 138" fill="none" stroke="#8e8ba6" stroke-width="1.4" stroke-dasharray="7 4 1 4"/>
            <g font-family="DM Sans Variable, system-ui, sans-serif" font-size="14" letter-spacing="1.4" fill="#aeabbd">
              <text x="350" y="110" text-anchor="end">UTTAR PRADESH</text>
              <text x="350" y="186" text-anchor="end">RAJASTHAN</text>
              <text x="350" y="204" text-anchor="end" letter-spacing=".3" font-size="14" fill="#8e8ba6">Dholpur district</text>
              <text x="350" y="290" text-anchor="end">MADHYA PRADESH</text>
            </g>
            <!-- the road -->
            <path d="M176 62 C170 100 184 150 172 200 S170 236 173 250 S150 330 160 330 S168 380 168 412" fill="none" stroke="#aeabbd" stroke-opacity=".55" stroke-width="2" stroke-dasharray="4 6"/>
            <path d="M176 62 C174 74 175 82 175 85" fill="none" stroke="#8fc9b0" stroke-width="10" stroke-linecap="round" opacity=".3" filter="url(#m2soft)"/>
            <path d="M176 62 C174 74 175 82 175 85" fill="none" stroke="#8fc9b0" stroke-width="4" stroke-linecap="round"/>
            <!-- stops -->
            <g font-family="DM Sans Variable, system-ui, sans-serif" font-size="14" fill="#ede6da">
              <circle cx="177" cy="129" r="4.5" fill="#05081f" stroke="#ede6da" stroke-width="1.6"/><text x="189" y="148">Border · 17 km</text>
              <circle cx="173" cy="250" r="4.5" fill="#05081f" stroke="#ede6da" stroke-width="1.6"/><text x="186" y="270">River · 47 km</text>
            </g>
            <!-- towns -->
            <circle cx="172" cy="200" r="5" fill="#05081f" stroke="#ede6da" stroke-width="2"/>
            <text x="160" y="196" text-anchor="end" font-family="Fraunces Variable, Georgia, serif" font-size="19" fill="#ede6da">Dholpur</text>
            <text x="160" y="214" text-anchor="end" font-family="DM Sans Variable, system-ui, sans-serif" font-size="14" fill="#aeabbd">42 km</text>
            <circle cx="162" cy="330" r="5" fill="#05081f" stroke="#ede6da" stroke-width="2"/>
            <text x="150" y="326" text-anchor="end" font-family="Fraunces Variable, Georgia, serif" font-size="19" fill="#ede6da">Morena</text>
            <text x="150" y="344" text-anchor="end" font-family="DM Sans Variable, system-ui, sans-serif" font-size="14" fill="#aeabbd">Food · 77 km</text>
            <!-- Agra, reached -->
            <circle cx="176" cy="62" r="34" fill="url(#m2glow)"/>
            <circle cx="176" cy="62" r="6" fill="#f2c46d"/>
            <text x="164" y="58" text-anchor="end" font-family="Fraunces Variable, Georgia, serif" font-size="22" fill="#f2c46d">Agra</text>
            <text x="164" y="76" text-anchor="end" font-family="DM Sans Variable, system-ui, sans-serif" font-size="14" fill="#d9c79b">reached 3 days ago</text>
            <!-- you -->
            <circle class="pulse" cx="175" cy="85" r="8" fill="none" stroke="#8fc9b0" stroke-width="2"/>
            <circle cx="175" cy="85" r="6" fill="#8fc9b0"/>
            <text x="188" y="90" font-family="DM Sans Variable, system-ui, sans-serif" font-weight="700" font-size="14" fill="#8fc9b0">You</text>
            <!-- Gwalior -->
            <circle cx="168" cy="412" r="7" fill="#05081f" stroke="#ede6da" stroke-width="2"/>
            <text x="182" y="418" font-family="Fraunces Variable, Georgia, serif" font-size="22" fill="#ede6da">Gwalior</text>
            <text x="182" y="436" font-family="DM Sans Variable, system-ui, sans-serif" font-size="14" fill="#aeabbd">112 km</text>
            <!-- scale -->
            <g transform="translate(250 370)" stroke="#aeabbd" stroke-width="1.2"><line x1="0" y1="0" x2="90" y2="0"/><line x1="0" y1="-4" x2="0" y2="4"/><line x1="45" y1="-4" x2="45" y2="4"/><line x1="90" y1="-4" x2="90" y2="4"/></g>
            <text x="295" y="392" text-anchor="middle" font-family="DM Mono" font-size="14" fill="#aeabbd">0  20  40 km</text>
